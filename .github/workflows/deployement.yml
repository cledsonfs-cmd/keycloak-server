name: CI/CD Keycloak Server

on:
  push:
    branches: [ "main" ]

jobs:
  build_and_push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/cledsonfs-cmd/keycloak-server:latest .

      - name: Push Docker image
        run: |
          docker push ghcr.io/cledsonfs-cmd/keycloak-server:latest

      - name: Trigger EasyPanel redeploy
        run: |
          curl -X POST ${{ secrets.EASYPANEL_WEBHOOK }}
